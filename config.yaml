# NightCool example configuration.
#
# Quick-start: change `location.address` and the `windows` list to match your
# house, then `nightcool serve` and edit the rest from the web UI.

location:
  address: "1600 Pennsylvania Ave NW, Washington DC"
  # latitude/longitude get filled in automatically once we geocode the address.
  # latitude: 38.8977
  # longitude: -77.0365
  timezone: "America/New_York"

# Per-day comfort target and routine.
# `target_f`     — the temperature you'd like the house to be at.
# `leave_at`     — typical departure time. If a CLOSE recommendation falls
#                  before this on a weekday, the app skips the notification
#                  on the assumption that you'll close on the way out.
# `home_all_day` — when true (weekends, days off), skip the leave-time logic.
schedule:
  mon: { target_f: 68, leave_at: "07:30" }
  tue: { target_f: 68, leave_at: "07:30" }
  wed: { target_f: 68, leave_at: "07:30" }
  thu: { target_f: 68, leave_at: "07:30" }
  fri: { target_f: 68, leave_at: "07:30" }
  sat: { target_f: 68, home_all_day: true }
  sun: { target_f: 68, home_all_day: true }

comfort_floor:
  min_indoor_f: 60.0  # Don't let the house drop below this overnight.

prefs:
  hysteresis_f: 2.5            # Outdoor must be this much cooler than indoor.
  min_tolerable_outdoor_f: 50  # Don't open below this — too cold regardless.
  quiet_hours_start: "22:30"   # Suppress OPEN notifications after this.
  quiet_hours_end: "06:00"     # Resume after this.

# All-optional secondary alerts. Defaults are off; flip on only what you care about.
warnings:
  warn_on_rain: false
  max_rain_chance_pct: 20.0
  warn_on_gusts: false        # Useful if loose papers, curtains, or allergies.
  max_gust_mph: 18.0
  bad_wind_sector_deg: null   # [lo, hi] degrees — e.g., [60, 120] to block easterly wind.

indoor_temp:
  source: "manual"            # manual | sensor_file | nest | ble
  manual_default_f: 71.0
  sensor_file_path: null
  # nest:
  #   project_id: ""
  #   client_id: ""
  #   client_secret: ""
  #   refresh_token: ""
  #   device_id: ""
  # ble:
  #   mac: "AA:BB:CC:DD:EE:FF"
  #   cache_file: "/var/lib/nightcool/upstairs.tempf"

windows:
  - id: br_west
    name: "Master Bedroom West"
    exposure: exposed
    security: secure
    on_bad_wind_sector: false
  - id: br_north
    name: "Master Bedroom North"
    exposure: exposed
    security: secure
    on_bad_wind_sector: false
  - id: bathroom_upstairs
    name: "Upstairs Bathroom"
    exposure: tiled
    security: secure
    on_bad_wind_sector: false

notifications:
  service: "console"          # ntfy | pushover | console | web_push
  ntfy_topic: "nightcool-yourname-random-string"
  ntfy_server: "https://ntfy.sh"
  pushover_user_key: null
  pushover_app_token: null
  # web_push:                 # Run `nightcool web-push-keys` to generate.
  #   vapid_public_key: ""
  #   vapid_private_key: ""
  #   vapid_subject: "mailto:you@example.com"

web:
  host: "127.0.0.1"
  port: 8765
  data_log_path: "data_log.sqlite"
