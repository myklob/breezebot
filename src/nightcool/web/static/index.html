<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3a55">
  <title>NightCool</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>NightCool</h1>
    <span id="indoor-readout" class="readout">--°F</span>
  </header>

  <main>
    <section id="card-action" class="card">
      <div class="action-title" id="action-title">Loading…</div>
      <div class="action-body" id="action-body"></div>
      <div class="action-windows" id="action-windows"></div>
      <div class="action-times" id="action-times"></div>
    </section>

    <section class="card">
      <h2>Indoor temperature</h2>
      <form id="indoor-form">
        <input id="indoor-input" type="number" step="0.1" min="40" max="120" required>
        <button type="submit">Set</button>
      </form>
      <p class="source-note" id="source-note"></p>
    </section>

    <section class="card">
      <h2>Schedule profile</h2>
      <select id="profile-select">
        <option value="commuter">Commuter</option>
        <option value="wfh">Work-from-home / retiree</option>
        <option value="night_shift">Night shift</option>
        <option value="light_sleeper">Light sleeper</option>
        <option value="aggressive">Aggressive cooler</option>
        <option value="conservative">Conservative</option>
        <option value="custom">Custom</option>
      </select>
      <p class="hint" id="profile-hint"></p>
    </section>

    <section class="card">
      <h2>Notifications</h2>
      <button id="enable-push">Enable push notifications</button>
      <p class="hint" id="push-status">Not subscribed</p>
    </section>

    <section class="card">
      <h2>Next 6 hours</h2>
      <table id="forecast-table">
        <thead><tr><th>Time</th><th>°F</th><th>Wind</th><th>Rain</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Savings</h2>
      <p id="savings-readout" class="readout">Collecting data…</p>
    </section>
  </main>

  <footer>
    <span id="status-line">—</span>
  </footer>

  <script src="/static/app.js" type="module"></script>
</body>
</html>
