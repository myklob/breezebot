[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nightcool"
version = "0.1.0"
description = "Free overnight cooling assistant: tells you when (and which) windows to open."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nightcool = "nightcool.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nightcool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
